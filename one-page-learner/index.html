<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1b1b2f">
<title>One Page Learner</title>
<style>
  :root {
    --bg: #fffdf5;
    --fg: #1b1b2f;
    --muted: #5a5a72;
    --card: #ffffff;
    --accent: #ff6b35;
    --accent-fg: #ffffff;
    --tab-bg: #e9e6da;
    --tab-active: #1b1b2f;
    --tab-active-fg: #fffdf5;
    --arrow-bg: rgba(27,27,47,0.06);
    --arrow-fg: #1b1b2f;
    --letter-colors: #e63946,#f4a261,#2a9d8f,#457b9d,#8e44ad,#e76f51,#1d3557,#d62828;
  }
  :root[data-theme="dark"] {
    --bg: #12121c;
    --fg: #fffdf5;
    --muted: #b8b8cc;
    --card: #1b1b2f;
    --accent: #ffb347;
    --accent-fg: #12121c;
    --tab-bg: #2a2a40;
    --tab-active: #fffdf5;
    --tab-active-fg: #12121c;
    --arrow-bg: rgba(255,253,245,0.08);
    --arrow-fg: #fffdf5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "Nunito", "Avenir Next", "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
    font-weight: 900;
    display: grid;
    grid-template-rows: auto 1fr;
    touch-action: none;
  }

  /* ---------- top bar ---------- */
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
  }
  .seg {
    display: flex;
    background: var(--tab-bg);
    border-radius: 999px;
    padding: 4px;
    gap: 4px;
  }
  .seg button {
    border: 0;
    background: transparent;
    color: var(--fg);
    font: inherit;
    font-size: 20px;
    font-weight: 900;
    min-height: 60px;
    min-width: 60px;
    padding: 0 22px;
    border-radius: 999px;
    cursor: pointer;
  }
  .seg button.on { background: var(--tab-active); color: var(--tab-active-fg); }
  .icon-btn {
    border: 0;
    background: var(--tab-bg);
    color: var(--fg);
    font-size: 26px;
    width: 60px; height: 60px;
    border-radius: 999px;
    cursor: pointer;
  }

  /* ---------- stage ---------- */
  main {
    position: relative;
    display: grid;
    grid-template-columns: minmax(80px, 12vw) 1fr minmax(80px, 12vw);
    align-items: stretch;
    min-height: 0;
  }
  .arrow {
    border: 0;
    background: var(--arrow-bg);
    color: var(--arrow-fg);
    font-size: clamp(48px, 7vw, 96px);
    cursor: pointer;
    margin: 0 12px 16px;
    border-radius: 28px;
    display: flex; align-items: center; justify-content: center;
  }
  .arrow:active { background: var(--accent); color: var(--accent-fg); }

  .card {
    display: grid;
    grid-template-rows: 1fr auto auto;
    align-items: center;
    justify-items: center;
    min-height: 0;
    padding: 0 8px 28px;
    gap: 6px;
  }
  .row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    align-items: center;
    justify-items: center;
    width: 100%;
    min-height: 0;
    gap: 2vw;
  }
  .glyph {
    font-size: min(40vh, 18vw);
    line-height: 1;
    color: var(--glyph, var(--accent));
    letter-spacing: -0.02em;
    white-space: nowrap;
    transition: transform .15s ease;
  }
  .glyph .lc { font-size: .78em; margin-left: .08em; }
  .glyph.pop { transform: scale(1.06); }
  .pic {
    font-size: min(30vh, 18vw);
    line-height: 1.15;
    text-align: center;
    max-width: 100%;
    word-break: break-word;
  }
  .pic.many { font-size: min(11vh, 5.5vw); letter-spacing: 0.04em; line-height: 1.2; }
  .label {
    font-size: clamp(22px, 4vh, 40px);
    color: var(--muted);
    text-transform: lowercase;
    text-align: center;
    min-height: 1.2em;
  }

  /* ---------- speaker ---------- */
  .speak {
    width: clamp(84px, 11vh, 120px);
    height: clamp(84px, 11vh, 120px);
    border-radius: 999px;
    border: 0;
    background: var(--accent);
    color: var(--accent-fg);
    font-size: clamp(40px, 5.5vh, 60px);
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(0,0,0,.25);
  }
  .speak:active { transform: scale(.94); }
  .speak.off { opacity: .35; }

  .toast {
    position: absolute;
    left: 50%; bottom: 24px;
    transform: translateX(-50%);
    background: var(--fg); color: var(--bg);
    font-size: 18px; font-weight: 700;
    padding: 12px 20px; border-radius: 14px;
    opacity: 0; pointer-events: none;
    transition: opacity .2s;
    max-width: 80vw; text-align: center;
  }
  .toast.show { opacity: 1; }

  @media (max-width: 600px) {
    .seg button { font-size: 16px; padding: 0 14px; }
    main { grid-template-columns: 72px 1fr 72px; }
    .arrow { margin: 0 6px 12px; }
  }
</style>
</head>
<body>
<header>
  <div class="seg" id="modeSeg">
    <button data-mode="abc" class="on">ABC</button>
    <button data-mode="123">123</button>
  </div>
  <div style="display:flex;gap:10px;align-items:center">
    <div class="seg" id="langSeg">
      <button data-lang="en" class="on">English</button>
      <button data-lang="es">Español</button>
    </div>
    <button class="icon-btn" id="themeBtn" aria-label="Toggle dark mode">🌙</button>
  </div>
</header>

<main id="stage">
  <button class="arrow" id="prev" aria-label="Previous">‹</button>
  <div class="card" id="card">
    <div class="row">
      <div class="glyph" id="glyph">A<span class="lc">a</span></div>
      <div class="pic" id="pic">🐊</div>
    </div>
    <div class="label" id="label">alligator</div>
    <button class="speak" id="speak" aria-label="Say it">🔊</button>
  </div>
  <button class="arrow" id="next" aria-label="Next">›</button>
  <div class="toast" id="toast"></div>
</main>

<script>
(function () {
  // ---------- data ----------
  const ABC = [
    ['A','🐊','alligator','a','cocodrilo'],
    ['B','🐦','bird','be','pájaro'],
    ['C','🐱','cat','ce','gato'],
    ['D','🐶','dog','de','perro'],
    ['E','🐘','elephant','e','elefante'],
    ['F','🐸','frog','efe','rana'],
    ['G','🦒','giraffe','ge','jirafa'],
    ['H','🐴','horse','hache','caballo'],
    ['I','🍦','ice cream','i','helado'],
    ['J','🪼','jellyfish','jota','medusa'],
    ['K','🪁','kite','ka','cometa'],
    ['L','🦁','lion','ele','león'],
    ['M','🐵','monkey','eme','mono'],
    ['N','🪺','nest','ene','nido'],
    ['O','🦉','owl','o','búho'],
    ['P','🐧','penguin','pe','pingüino'],
    ['Q','👑','queen','cu','reina'],
    ['R','🐰','rabbit','erre','conejo'],
    ['S','🐍','snake','ese','serpiente'],
    ['T','🐯','tiger','te','tigre'],
    ['U','☂️','umbrella','u','paraguas'],
    ['V','🚐','van','uve','furgoneta'],
    ['W','🐋','whale','doble uve','ballena'],
    ['X','🩻','x-ray','equis','radiografía'],
    ['Y','🧶','yarn','i griega','hilo'],
    ['Z','🦓','zebra','zeta','cebra'],
  ];
  const NUM_EMOJI = ['🍎','🍌','🍓','🍇','🍊','🍋','🍉','🍒','🥕','🍪','⭐','🎈','🐟','🦋','🌼','🐞','🚗','🍩','🐢','🐥'];
  const NUM_EN = ['one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen','twenty'];
  const NUM_ES = ['uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once','doce','trece','catorce','quince','dieciséis','diecisiete','dieciocho','diecinueve','veinte'];
  const WORD_EN = ['apple','bananas','strawberries','grapes','oranges','lemons','watermelons','cherries','carrots','cookies','stars','balloons','fish','butterflies','flowers','ladybugs','cars','donuts','turtles','chicks'];
  const WORD_ES = ['manzana','plátanos','fresas','uvas','naranjas','limones','sandías','cerezas','zanahorias','galletas','estrellas','globos','peces','mariposas','flores','mariquitas','coches','donas','tortugas','pollitos'];

  const NUMS = NUM_EMOJI.map((e, i) => [
    String(i + 1), e.repeat(i + 1), NUM_EN[i] + ' ' + WORD_EN[i], NUM_ES[i], NUM_ES[i] + ' ' + WORD_ES[i]
  ]);
  // row: [glyph, picture, enLabel, esName, esLabel]

  const COLORS = ['#e63946','#f4a261','#2a9d8f','#457b9d','#8e44ad','#e76f51','#d62828','#06a77d'];

  // ---------- state ----------
  const st = { mode: 'abc', lang: 'en', i: { abc: 0, '123': 0 } };
  try {
    const saved = JSON.parse(localStorage.getItem('opl') || '{}');
    if (saved.lang) st.lang = saved.lang;
    if (saved.theme) document.documentElement.dataset.theme = saved.theme;
  } catch (e) {}
  function save() { try { localStorage.setItem('opl', JSON.stringify({ lang: st.lang, theme: document.documentElement.dataset.theme || '' })); } catch (e) {} }

  const $ = id => document.getElementById(id);
  const glyph = $('glyph'), pic = $('pic'), label = $('label');

  function items() { return st.mode === 'abc' ? ABC : NUMS; }
  function cur() { return items()[st.i[st.mode]]; }

  function render() {
    const it = cur();
    glyph.textContent = it[0];
    if (st.mode === 'abc') { const lc = document.createElement('span'); lc.className = 'lc'; lc.textContent = it[0].toLowerCase(); glyph.appendChild(lc); }
    glyph.style.setProperty('--glyph', COLORS[st.i[st.mode] % COLORS.length]);
    pic.textContent = it[1];
    pic.classList.toggle('many', st.mode === '123' && st.i[st.mode] >= 5);
    label.textContent = st.lang === 'en' ? it[2] : it[4];
    glyph.classList.add('pop');
    setTimeout(() => glyph.classList.remove('pop'), 150);
    document.querySelectorAll('#modeSeg button').forEach(b => b.classList.toggle('on', b.dataset.mode === st.mode));
    document.querySelectorAll('#langSeg button').forEach(b => b.classList.toggle('on', b.dataset.lang === st.lang));
    $('themeBtn').textContent = document.documentElement.dataset.theme === 'dark' ? '☀️' : '🌙';
  }

  function step(d) {
    const n = items().length;
    st.i[st.mode] = (st.i[st.mode] + d + n) % n;
    render();
    speak();
  }

  // ---------- speech ----------
  const synth = window.speechSynthesis;
  const speakBtn = $('speak');
  let voices = [];
  function loadVoices() { if (synth) voices = synth.getVoices(); }
  if (synth) { loadVoices(); synth.onvoiceschanged = loadVoices; }
  else speakBtn.classList.add('off');

  // Rank voices: neural/natural voices first, robotic/compact ones last.
  const GOOD = [/natural/i, /neural/i, /premium/i, /enhanced/i, /google/i, /siri/i, /samantha/i, /ava/i, /allison/i, /zoe/i, /paulina/i, /m[oó]nica/i, /microsoft .*online/i, /aria/i, /jenny/i, /dalia/i, /elvira/i];
  const BAD = [/espeak/i, /compact/i, /fred/i, /albert/i, /zarvox/i, /trinoids/i, /whisper/i, /bells/i, /bad news/i, /bubbles/i, /junior/i, /ralph/i];
  function score(v, lang) {
    const l = (v.lang || '').toLowerCase().replace('_', '-');
    const n = v.name || '';
    let s = 0;
    if (lang === 'es') { if (l.startsWith('es-mx') || l.startsWith('es-us')) s += 30; else if (l.startsWith('es')) s += 20; else return -1; }
    else { if (l.startsWith('en-us')) s += 30; else if (l.startsWith('en')) s += 20; else return -1; }
    GOOD.forEach((r, i) => { if (r.test(n)) s += 20 - i; });
    BAD.forEach(r => { if (r.test(n)) s -= 50; });
    if (v.localService === false) s += 5; // cloud voices are usually the neural ones
    return s;
  }
  function pickVoice(lang) {
    let best = null, bs = -1;
    for (const v of voices) { const sc = score(v, lang); if (sc > bs) { bs = sc; best = v; } }
    return best;
  }

  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2500);
  }

  function speak() {
    if (!synth || !window.SpeechSynthesisUtterance) { toast('Sound is not supported in this browser.'); return; }
    const it = cur();
    let text;
    if (st.lang === 'en') text = st.mode === 'abc' ? `${it[0]}, ${it[2]}` : `${it[2]}`;
    else text = st.mode === 'abc' ? `${it[3]}, ${it[4].split(' ').slice(-1)[0]}` : `${it[4]}`;
    synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = st.lang === 'en' ? 'en-US' : 'es-MX';
    const v = pickVoice(st.lang);
    if (v) u.voice = v;
    u.rate = 1;
    u.pitch = 1;
    synth.speak(u);
  }

  // ---------- events ----------
  $('prev').addEventListener('click', () => step(-1));
  $('next').addEventListener('click', () => step(1));
  speakBtn.addEventListener('click', speak);
  $('modeSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; st.mode = b.dataset.mode; render(); speak(); });
  $('langSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; st.lang = b.dataset.lang; save(); render(); speak(); });
  $('themeBtn').addEventListener('click', () => {
    const d = document.documentElement.dataset.theme === 'dark' ? '' : 'dark';
    if (d) document.documentElement.dataset.theme = d; else delete document.documentElement.dataset.theme;
    save(); render();
  });

  // tap on the card = next; swipe left/right = next/prev
  const card = $('card');
  let sx = 0, sy = 0, st0 = 0;
  card.addEventListener('pointerdown', e => { if (e.target.closest('button')) { sx = NaN; return; } sx = e.clientX; sy = e.clientY; st0 = Date.now(); });
  card.addEventListener('pointerup', e => {
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) step(dx < 0 ? 1 : -1);
    else if (Math.abs(dx) < 10 && Math.abs(dy) < 10 && Date.now() - st0 < 400) step(1);
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === ' ') step(1);
    else if (e.key === 'ArrowLeft') step(-1);
    else if (e.key === 'Enter') speak();
  });

  render();
})();
</script>
</body>
</html>
